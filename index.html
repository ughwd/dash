<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CINEARCHIVE — дашборд киноархива</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0e0e0e; --bg-2: #161616; --bg-3: #1d1d1d;
  --line: #2a2a2a; --fg: #f1f1ee; --fg-dim: #8a8a86;
  --accent: #e8ff47; --accent-2: #ff4b2b;
  --radius: 2px;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--fg); font-family: var(--font-display); font-size: 15px; line-height: 1.4; min-height: 100%; }

.topbar {
  display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center;
  padding: 18px 28px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg); z-index: 50;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.05em; white-space: nowrap; }
.brand-mark { color: var(--accent); font-size: 22px; }
.brand-name em { color: var(--accent); font-style: normal; }

.search-wrap { position: relative; }
.search-wrap input {
  width: 100%; background: var(--bg-2); border: 1px solid var(--line); color: var(--fg);
  padding: 10px 36px 10px 14px; font-family: var(--font-mono); font-size: 13px;
  border-radius: var(--radius); outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-hint { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--fg-dim); font-size: 12px; pointer-events: none; }

.api-key-wrap { display: flex; gap: 6px; align-items: center; }
.api-key-wrap input {
  background: var(--bg-2); border: 1px solid var(--line); color: var(--fg);
  padding: 8px 10px; font-family: var(--font-mono); font-size: 12px;
  width: 200px; border-radius: var(--radius); outline: none;
}
.api-key-wrap input:focus { border-color: var(--accent); }

.status-bar { padding: 10px 28px; font-family: var(--font-mono); font-size: 12px;
  background: #2a1a1a; color: #ff8a8a; border-bottom: 1px solid #4a2a2a; }
.status-bar.ok { background: #1a2a1a; color: #8aff8a; border-color: #2a4a2a; }
.status-bar.info { background: #1a1a2a; color: #8a8aff; border-color: #2a2a4a; }

.btn {
  font-family: var(--font-display); font-size: 12px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 10px 16px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--bg-3); color: var(--fg);
  cursor: pointer; transition: 0.15s;
}
.btn:hover { background: #2a2a2a; }
.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
.btn-primary:hover { background: #d9ef30; }
.btn-ghost { background: transparent; }

.tabs { display: flex; padding: 0 28px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  background: none; border: none; color: var(--fg-dim);
  font-family: var(--font-display); font-size: 13px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 16px 20px; cursor: pointer; border-bottom: 2px solid transparent;
  transition: 0.15s; white-space: nowrap;
}
.tab:hover { color: var(--fg); }
.tab.is-active { color: var(--accent); border-bottom-color: var(--accent); }

.filters-strip { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 28px; border-bottom: 1px solid var(--line); }
.filters-strip:empty { display: none; }
.badge { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-3);
  border: 1px solid var(--line); padding: 4px 10px; font-family: var(--font-mono);
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-radius: var(--radius); }
.badge b { color: var(--accent); font-weight: 600; }

main { padding: 28px; }
.tab-panel { display: none; }
.tab-panel.is-active { display: block; }

.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.kpi { border: 1px solid var(--line); padding: 20px; background: var(--bg-2); border-radius: var(--radius); }
.kpi-value { font-family: var(--font-mono); font-size: 36px; font-weight: 600;
  color: var(--accent); line-height: 1; margin-bottom: 8px; word-break: break-word; }
.kpi-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg-dim); }

.panel { border: 1px solid var(--line); background: var(--bg-2); padding: 22px; border-radius: var(--radius); margin-bottom: 20px; }
.panel-title { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 16px; font-weight: 700; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-2 .panel { margin-bottom: 20px; }
.canvas-wrap { position: relative; height: 320px; width: 100%; }

#tab-discover.is-active { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
.filters { border: 1px solid var(--line); background: var(--bg-2); padding: 20px; border-radius: var(--radius); position: sticky; top: 90px; }
.field { display: block; margin-bottom: 14px; }
.field span { display: block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 6px; }
.field.inline { display: flex; align-items: center; gap: 10px; margin: 0; }
.field.inline span { margin: 0; }
.field select, .field input[type="number"] {
  width: 100%; background: var(--bg-3); border: 1px solid var(--line); color: var(--fg);
  padding: 8px 10px; font-family: var(--font-mono); font-size: 13px;
  border-radius: var(--radius); outline: none;
}
.field input[type="range"] { width: 100%; accent-color: var(--accent); }
.filter-actions { display: flex; gap: 8px; margin-top: 16px; }
.filter-actions .btn { flex: 1; }

.discover-main { min-width: 0; }
.discover-toolbar { display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 12px; }
.results-count { font-family: var(--font-mono); font-size: 13px; color: var(--fg-dim); }
.results-count b { color: var(--accent); }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.movie-card { border: 1px solid var(--line); background: var(--bg-2); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; transition: 0.15s; display: flex; flex-direction: column; }
.movie-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.movie-poster { aspect-ratio: 2/3; background: var(--bg-3); position: relative; overflow: hidden; }
.movie-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.movie-poster .no-poster { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  color: var(--fg-dim); font-family: var(--font-mono); font-size: 11px; text-align: center; padding: 8px; }
.movie-rating { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8);
  font-family: var(--font-mono); font-weight: 600; font-size: 12px; padding: 3px 7px; border-radius: var(--radius); }
.movie-rating.low { color: #ff5555; }
.movie-rating.mid { color: #cccccc; }
.movie-rating.high { color: var(--accent); }
.movie-body { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.movie-title { font-size: 14px; font-weight: 700; line-height: 1.25; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.movie-meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); }
.movie-genres { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
.genre-tag { font-family: var(--font-mono); font-size: 10px; padding: 2px 6px;
  border: 1px solid var(--line); color: var(--fg-dim); border-radius: var(--radius); text-transform: uppercase; }

.pagination { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 28px; }
.pagination button { background: var(--bg-2); border: 1px solid var(--line); color: var(--fg);
  font-family: var(--font-mono); font-size: 12px; min-width: 36px; height: 36px;
  cursor: pointer; border-radius: var(--radius); padding: 0 10px; }
.pagination button:hover:not(:disabled) { border-color: var(--accent); }
.pagination button.is-active { background: var(--accent); color: #000; border-color: var(--accent); }
.pagination button:disabled { opacity: 0.3; cursor: not-allowed; }

.modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal[hidden] { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); }
.modal-content { position: relative; background: var(--bg-2); border: 1px solid var(--line);
  max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; border-radius: var(--radius); }
.modal-close { position: absolute; top: 12px; right: 12px; background: var(--bg-3);
  border: 1px solid var(--line); color: var(--fg); width: 32px; height: 32px;
  cursor: pointer; font-size: 18px; border-radius: var(--radius); z-index: 2; }
.modal-head { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 28px; border-bottom: 1px solid var(--line); }
.modal-head img { width: 100%; border-radius: var(--radius); display: block; }
.modal-title { font-size: 28px; font-weight: 700; line-height: 1.1; margin-bottom: 8px; }
.modal-original { font-family: var(--font-mono); font-size: 13px; color: var(--fg-dim); margin-bottom: 16px; }
.modal-overview { margin-top: 16px; line-height: 1.6; color: #d0d0cc; }
.modal-facts { display: flex; flex-wrap: wrap; gap: 16px; font-family: var(--font-mono); font-size: 12px; margin-bottom: 14px; }
.modal-facts span b { color: var(--accent); }
.modal-body { padding: 28px; }
.modal-section h4 { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 12px; }
.cast-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.cast-item { border: 1px solid var(--line); padding: 10px; border-radius: var(--radius); background: var(--bg-3); }
.cast-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.cast-role { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); }

.loading, .empty { grid-column: 1 / -1; padding: 40px; text-align: center;
  color: var(--fg-dim); font-family: var(--font-mono); font-size: 13px; }

@media (max-width: 900px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
  #tab-discover.is-active { grid-template-columns: 1fr; }
  .filters { position: static; }
  .modal-head { grid-template-columns: 1fr; }
  .topbar { grid-template-columns: 1fr; gap: 12px; }
  .api-key-wrap input { width: 100%; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◼</span>
    <span class="brand-name">CINE<em>ARCHIVE</em></span>
  </div>
  <div class="search-wrap">
    <input id="globalSearch" type="text" placeholder="Поиск фильма по названию…" autocomplete="off" />
    <span class="search-hint">↵</span>
  </div>
  <div class="api-key-wrap">
    <input id="apiKey" type="password" placeholder="TMDB API key (v3)" />
    <button id="saveKey" class="btn btn-ghost">OK</button>
  </div>
</header>

<div id="statusBar" class="status-bar info">Загрузка интерфейса…</div>

<nav class="tabs">
  <button class="tab is-active" data-tab="overview">Overview</button>
  <button class="tab" data-tab="discover">Discover</button>
  <button class="tab" data-tab="analytics">Analytics</button>
</nav>

<div id="activeFilters" class="filters-strip"></div>

<main>

  <section id="tab-overview" class="tab-panel is-active">
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-value" id="kpiTotal">—</div><div class="kpi-label">Фильмов в базе</div></div>
      <div class="kpi"><div class="kpi-value" id="kpiRating">—</div><div class="kpi-label">Средний рейтинг</div></div>
      <div class="kpi"><div class="kpi-value" id="kpiYears">—</div><div class="kpi-label">Диапазон лет</div></div>
      <div class="kpi"><div class="kpi-value" id="kpiGenres">—</div><div class="kpi-label">Жанров</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h3 class="panel-title">Фильмы по десятилетиям</h3>
        <div class="canvas-wrap"><canvas id="chartDecades"></canvas></div>
      </div>
      <div class="panel">
        <h3 class="panel-title">Распределение по жанрам</h3>
        <div class="canvas-wrap"><canvas id="chartGenres"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h3 class="panel-title">Топ стран производства</h3>
      <div class="canvas-wrap"><canvas id="chartCountries"></canvas></div>
    </div>

    <div class="panel">
      <h3 class="panel-title">Популярные сейчас</h3>
      <div class="card-grid" id="popularGrid"><div class="loading">Загрузка…</div></div>
    </div>
  </section>

  <section id="tab-discover" class="tab-panel">
    <aside class="filters">
      <h3 class="panel-title">Фильтры</h3>
      <label class="field">
        <span>Жанр</span>
        <select id="filterGenre"><option value="">Все</option></select>
      </label>
      <label class="field">
        <span>Год от</span>
        <input id="filterYearFrom" type="number" min="1900" max="2030" placeholder="1900" />
      </label>
      <label class="field">
        <span>Год до</span>
        <input id="filterYearTo" type="number" min="1900" max="2030" placeholder="2030" />
      </label>
      <label class="field">
        <span>Мин. рейтинг: <output id="ratingOut">0</output></span>
        <input id="filterRating" type="range" min="0" max="10" step="0.5" value="0" />
      </label>
      <label class="field">
        <span>Страна</span>
        <select id="filterCountry"><option value="">Все</option></select>
      </label>
      <div class="filter-actions">
        <button id="applyFilters" class="btn btn-primary">Применить</button>
        <button id="resetFilters" class="btn btn-ghost">Сброс</button>
      </div>
    </aside>

    <div class="discover-main">
      <div class="discover-toolbar">
        <div class="results-count" id="resultsCount">—</div>
        <label class="field inline">
          <span>Сортировка</span>
          <select id="sortBy">
            <option value="popularity.desc">Популярность ↓</option>
            <option value="vote_average.desc">Рейтинг ↓</option>
            <option value="primary_release_date.desc">Новые</option>
            <option value="primary_release_date.asc">Старые</option>
          </select>
        </label>
      </div>
      <div class="card-grid" id="discoverGrid"><div class="loading">Загрузка…</div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </section>

  <section id="tab-analytics" class="tab-panel">
    <div class="panel">
      <h3 class="panel-title">Распределение рейтингов</h3>
      <div class="canvas-wrap"><canvas id="chartRatings"></canvas></div>
    </div>
    <div class="panel">
      <h3 class="panel-title">Рейтинг vs популярность</h3>
      <div class="canvas-wrap"><canvas id="chartScatter"></canvas></div>
    </div>
    <div class="panel">
      <h3 class="panel-title">Топ-10 по числу голосов</h3>
      <div class="canvas-wrap"><canvas id="chartVotes"></canvas></div>
    </div>
  </section>

</main>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-content" id="modalContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
/* =========================================================
   CINEARCHIVE — всё в одном файле
   ========================================================= */

const TMDB_BASE = 'https://api.themoviedb.org/3';
const IMG_BASE  = 'https://image.tmdb.org/t/p';

let API_KEY = localStorage.getItem('tmdb_key') || '';
let DEMO_MODE = !API_KEY;

const state = {
  genres: [
    { id: 28, name: 'Боевик' }, { id: 12, name: 'Приключения' },
    { id: 16, name: 'Анимация' }, { id: 35, name: 'Комедия' },
    { id: 80, name: 'Криминал' }, { id: 99, name: 'Документальный' },
    { id: 18, name: 'Драма' }, { id: 10751, name: 'Семейный' },
    { id: 14, name: 'Фэнтези' }, { id: 36, name: 'История' },
    { id: 27, name: 'Ужасы' }, { id: 10402, name: 'Музыка' },
    { id: 9648, name: 'Детектив' }, { id: 10749, name: 'Романтика' },
    { id: 878, name: 'Фантастика' }, { id: 53, name: 'Триллер' },
    { id: 10752, name: 'Военный' }, { id: 37, name: 'Вестерн' }
  ],
  countries: [
    { code: 'US', name: 'США' }, { code: 'GB', name: 'Великобритания' },
    { code: 'FR', name: 'Франция' }, { code: 'DE', name: 'Германия' },
    { code: 'IT', name: 'Италия' }, { code: 'ES', name: 'Испания' },
    { code: 'JP', name: 'Япония' }, { code: 'KR', name: 'Корея' },
    { code: 'CN', name: 'Китай' }, { code: 'IN', name: 'Индия' },
    { code: 'RU', name: 'Россия' }, { code: 'SE', name: 'Швеция' },
    { code: 'BR', name: 'Бразилия' }, { code: 'MX', name: 'Мексика' }
  ],
  filters: { genre: '', yearFrom: '', yearTo: '', rating: 0, country: '', sort: 'popularity.desc', page: 1 },
  searchQuery: '',
  discoverTotalPages: 1,
  charts: {}
};

const $  = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function posterUrl(path, size = 'w342') {
  return path ? `${IMG_BASE}/${size}${path}` : null;
}
function ratingClass(r) {
  if (r >= 8) return 'high';
  if (r >= 6) return 'mid';
  return 'low';
}
function debounce(fn, ms = 500) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function showStatus(msg, kind = 'info') {
  const el = $('#statusBar');
  el.textContent = msg;
  el.className = 'status-bar ' + kind;
  el.hidden = false;
  if (kind === 'ok') setTimeout(() => { el.hidden = true; }, 2500);
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

/* ---------- FETCH ---------- */
async function tmdb(path, params = {}) {
  if (!API_KEY) throw new Error('NO_API_KEY');
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set('api_key', API_KEY);
  url.searchParams.set('language', 'ru-RU');
  Object.entries(params).forEach(([k, v]) => {
    if (v !== '' && v !== null && v !== undefined) url.searchParams.set(k, v);
  });
  const res = await fetch(url.toString());
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`TMDB ${res.status}: ${text.slice(0, 120)}`);
  }
  return res.json();
}

/* =========================================================
   DEMO DATA — если нет ключа
   ========================================================= */
const DEMO_MOVIES = [
  { id: 1, title: 'Крёстный отец', original_title: 'The Godfather', release_date: '1972-03-14', vote_average: 8.7, vote_count: 19000, poster_path: null, genre_ids: [18, 80], overview: 'История семьи Корлеоне.', popularity: 120 },
  { id: 2, title: 'Побег из Шоушенка', original_title: 'The Shawshank Redemption', release_date: '1994-09-23', vote_average: 8.7, vote_count: 25000, poster_path: null, genre_ids: [18, 80], overview: 'История надежды в тюрьме.', popularity: 140 },
  { id: 3, title: 'Тёмный рыцарь', original_title: 'The Dark Knight', release_date: '2008-07-16', vote_average: 8.5, vote_count: 31000, poster_path: null, genre_ids: [28, 80, 18], overview: 'Бэтмен против Джокера.', popularity: 200 },
  { id: 4, title: 'Криминальное чтиво', original_title: 'Pulp Fiction', release_date: '1994-09-10', vote_average: 8.5, vote_count: 26000, poster_path: null, genre_ids: [80, 18], overview: 'Несколько переплетённых историй.', popularity: 180 },
  { id: 5, title: 'Форрест Гамп', original_title: 'Forrest Gump', release_date: '1994-07-06', vote_average: 8.5, vote_count: 24000, poster_path: null, genre_ids: [35, 18, 10749], overview: 'Жизнь простого человека.', popularity: 160 },
  { id: 6, title: 'Начало', original_title: 'Inception', release_date: '2010-07-16', vote_average: 8.4, vote_count: 34000, poster_path: null, genre_ids: [28, 878, 53], overview: 'Сон внутри сна.', popularity: 250 },

function demoDiscoverResponse() {
  const f = state.filters;
  let list = [...DEMO_MOVIES];
  if (f.genre) {
    const gid = Number(f.genre);
    list = list.filter(m => m.genre_ids.includes(gid));
  }
  if (f.yearFrom) list = list.filter(m => Number(m.release_date.slice(0,4)) >= Number(f.yearFrom));
  if (f.yearTo)   list = list.filter(m => Number(m.release_date.slice(0,4)) <= Number(f.yearTo));
  if (Number(f.rating) > 0) list = list.filter(m => m.vote_average >= Number(f.rating));
  if (f.sort === 'vote_average.desc') list.sort((a,b) => b.vote_average - a.vote_average);
  else if (f.sort === 'primary_release_date.desc') list.sort((a,b) => b.release_date.localeCompare(a.release_date));
  else if (f.sort === 'primary_release_date.asc')  list.sort((a,b) => a.release_date.localeCompare(b.release_date));
  else list.sort((a,b) => b.popularity - a.popularity);
  return { results: list, total_results: list.length, total_pages: 1, page: 1 };
}

/* =========================================================
   INIT
   ========================================================= */
document.addEventListener('DOMContentLoaded', init);

async function init() {
  bindUI();

  if (!API_KEY) {
    DEMO_MODE = true;
    $('#apiKey').value = '';
    showStatus('ДЕМО-РЕЖИМ: показываю примерные данные. Введите TMDB API key (v3) справа сверху и нажмите OK для реальных данных.', 'info');
    renderDemoAll();
    return;
  }

  $('#apiKey').value = API_KEY;
  DEMO_MODE = false;
  await bootstrap();
}

function renderDemoAll() {
  // KPI
  $('#kpiTotal').textContent = DEMO_MOVIES.length.toString();
  const avg = DEMO_MOVIES.reduce((s,m)=>s+m.vote_average,0) / DEMO_MOVIES.length;
  $('#kpiRating').textContent = avg.toFixed(1);
  const years = DEMO_MOVIES.map(m => Number(m.release_date.slice(0,4)));
  $('#kpiYears').textContent = `${Math.min(...years)}–${Math.max(...years)}`;
  $('#kpiGenres').textContent = state.genres.length;

  // Populates
  populateSelects();

  // Overview charts (демо)
  drawBar('chartDecades',
    ['1950s','1960s','1970s','1980s','1990s','2000s','2010s','2020s'],
    [1200, 1800, 2400, 3200, 4100, 5200, 6800, 2400], 'Фильмов');

  drawDoughnut('chartGenres',
    state.genres.slice(0,10).map(g => g.name),
    [8200, 3400, 2100, 5400, 2800, 900, 7100, 1600, 1300, 700]);

  drawBar('chartCountries',
    state.countries.slice(0,10).map(c => c.name),
    [18000, 4200, 3800, 3100, 2200, 1900, 2800, 1500, 1400, 2400, 1800, 900, 800, 600],
    'Фильмов', true);

  // Popular grid
  const grid = $('#popularGrid');
  grid.innerHTML = DEMO_MOVIES.slice(0, 12).map(movieCardHTML).join('');
  attachCardClicks(grid);

  // Discover
  renderDiscover();

  // Analytics (демо)
  drawDemoAnalytics();
}

async function bootstrap() {
  try {
    showStatus('Загружаю данные…', 'info');
    await loadGenres();
    populateSelects();
    $('#kpiGenres').textContent = state.genres.length;

    await renderOverview();
    await renderDiscover();
    renderFiltersStrip();
    showStatus('Данные загружены', 'ok');
  } catch (e) {
    console.error(e);
    if (e.message === 'NO_API_KEY') showStatus('Введите API key', 'info');
    else if (e.message.includes('401')) showStatus('Неверный API key (401). Проверьте ключ.', 'info');
    else showStatus('Ошибка: ' + e.message, 'info');
    // fallback — демо
    DEMO_MODE = true;
    renderDemoAll();
  }
}

function bindUI() {
  $('#saveKey').addEventListener('click', async () => {
    const v = $('#apiKey').value.trim();
    if (!v) { showStatus('Пустой ключ', 'info'); return; }
    API_KEY = v;
    localStorage.setItem('tmdb_key', v);
    DEMO_MODE = false;
    showStatus('Проверяю ключ…', 'info');
    await bootstrap();
  });

  $$('.tab').forEach(t => t.addEventListener('click', () => {
    $$('.tab').forEach(x => x.classList.remove('is-active'));
    $$('.tab-panel').forEach(x => x.classList.remove('is-active'));
    t.classList.add('is-active');
    $('#tab-' + t.dataset.tab).classList.add('is-active');
    if (t.dataset.tab === 'analytics') renderAnalytics();
  }));

  const search = $('#globalSearch');
  search.addEventListener('input', debounce(async (e) => {
    state.searchQuery = e.target.value.trim();
    if (!state.searchQuery) { await renderDiscover(); return; }
    await runSearch(state.searchQuery);
  }, 500));

  $('#filterGenre').addEventListener('change', e => state.filters.genre = e.target.value);
  $('#filterYearFrom').addEventListener('input', e => state.filters.yearFrom = e.target.value);
  $('#filterYearTo').addEventListener('input', e => state.filters.yearTo = e.target.value);
  $('#filterRating').addEventListener('input', e => {
    state.filters.rating = e.target.value;
    $('#ratingOut').value = e.target.value;
  });
  $('#filterCountry').addEventListener('change', e => state.filters.country = e.target.value);
  $('#sortBy').addEventListener('change', e => {
    state.filters.sort = e.target.value;
    state.filters.page = 1;
    if (!state.searchQuery) renderDiscover();
  });

  $('#applyFilters').addEventListener('click', () => {
    state.filters.page = 1;
    state.searchQuery = '';
    $('#globalSearch').value = '';
    renderDiscover();
    renderFiltersStrip();
  });

  $('#resetFilters').addEventListener('click', () => {
    state.filters = { genre: '', yearFrom: '', yearTo: '', rating: 0, country: '', sort: 'popularity.desc', page: 1 };
    $('#filterGenre').value = '';
    $('#filterYearFrom').value = '';
    $('#filterYearTo').value = '';
    $('#filterRating').value = 0;
    $('#ratingOut').value = 0;
    $('#filterCountry').value = '';
    $('#sortBy').value = 'popularity.desc';
    renderDiscover();
    renderFiltersStrip();
  });

  $('#modal').addEventListener('click', e => {
    if (e.target.dataset.close !== undefined) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
}

/* =========================================================
   GENRES
   ========================================================= */
async function loadGenres() {
  const data = await tmdb('/genre/movie/list');
  state.genres = data.genres || state.genres;
}

function populateSelects() {
  const sel = $('#filterGenre');
  sel.innerHTML = '<option value="">Все</option>' +
    state.genres.map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('');

  const csel = $('#filterCountry');
  csel.innerHTML = '<option value="">Все</option>' +
    state.countries.map(c => `<option value="${c.code}">${escapeHtml(c.name)}</option>`).join('');
}

function genreName(id) {
  const g = state.genres.find(x => x.id === id);
  return g ? g.name : '';
}

/* =========================================================
   CARDS
   ========================================================= */
function movieCardHTML(m) {
  const poster = posterUrl(m.poster_path, 'w342');
  const rating = Number(m.vote_average || 0).toFixed(1);
  const year = (m.release_date || '').slice(0, 4) || '—';
  const genres = (m.genre_ids || []).slice(0, 3).map(id =>
    `<span class="genre-tag">${escapeHtml(genreName(id))}</span>`
  ).join('');
  return `
    <div class="movie-card" data-id="${m.id}">
      <div class="movie-poster">
        ${poster ? `<img loading="lazy" src="${poster}" alt="${escapeHtml(m.title)}">`
                 : `<div class="no-poster">${escapeHtml((m.title || '').slice(0,40))}</div>`}
        <div class="movie-rating ${ratingClass(m.vote_average)}">${rating}</div>
      </div>
      <div class="movie-body">
        <div class="movie-title">${escapeHtml(m.title)}</div>
        <div class="movie-meta">${year}</div>
        <div class="movie-genres">${genres}</div>
      </div>
    </div>`;
}

function attachCardClicks(container) {
  container.querySelectorAll('.movie-card').forEach(card => {
    card.addEventListener('click', () => openMovie(Number(card.dataset.id)));
  });
}

/* =========================================================
   OVERVIEW
   ========================================================= */
async function renderOverview() {
  const pop = await tmdb('/movie/popular', { page: 1 });
  $('#kpiTotal').textContent = (pop.total_results || 0).toLocaleString('ru-RU');
  const avg = pop.results.length ? pop.results.reduce((s,m)=>s+(m.vote_average||0),0) / pop.results.length : 0;
  $('#kpiRating').textContent = avg.toFixed(1);
  const years = pop.results.map(m => Number((m.release_date||'').slice(0,4))).filter(Boolean);
  if (years.length) $('#kpiYears').textContent = `${Math.min(...years)}–${Math.max(...years)}`;

  const grid = $('#popularGrid');
  grid.innerHTML = pop.results.slice(0, 12).map(movieCardHTML).join('');
  attachCardClicks(grid);

  renderDecadesChart().catch(e => console.error(e));
  renderGenresChart().catch(e => console.error(e));
  renderCountriesChart().catch(e => console.error(e));
}

async function renderDecadesChart() {
  const decades = [
    { label: '1950s', from: '1950-01-01', to: '1959-12-31' },
    { label: '1960s', from: '1960-01-01', to: '1969-12-31' },
    { label: '1970s', from: '1970-01-01', to: '1979-12-31' },
    { label: '1980s', from: '1980-01-01', to: '1989-12-31' },
    { label: '1990s', from: '1990-01-01', to: '1999-12-31' },
    { label: '2000s', from: '2000-01-01', to: '2009-12-31' },
    { label: '2010s', from: '2010-01-01', to: '2019-12-31' },
    { label: '2020s', from: '2020-01-01', to: '2029-12-31' },

async function renderGenresChart() {

    tmdb('/discover/movie', { with_genres: g.id, page: 1 })

async function renderCountriesChart() {
  const top = state.countries.slice(0, 10);
  const counts = await Promise.all(top.map(c =>
    tmdb('/discover/movie', { with_origin_country: c.code, page: 1 })

/* =========================================================
   DISCOVER
   ========================================================= */
async function renderDiscover() {
  let data;
  if (DEMO_MODE) {
    data = demoDiscoverResponse();
  } else {
    try {
      data = await tmdb('/discover/movie', buildDiscoverParams());
    } catch (e) {
      console.error('discover', e);
      $('#discoverGrid').innerHTML = '<div class="empty">Ошибка запроса: ' + escapeHtml(e.message) + '</div>';
      return;
    }
  }

  state.discoverTotalPages = Math.min(data.total_pages || 1, 500);
  $('#resultsCount').innerHTML =
    `Найдено: <b>${(data.total_results || 0).toLocaleString('ru-RU')}</b> фильмов · страница <b>${data.page||1}</b> из <b>${state.discoverTotalPages}</b>`;

  const grid = $('#discoverGrid');
  if (!data.results || !data.results.length) {
    grid.innerHTML = '<div class="empty">Ничего не найдено</div>';
  } else {
    grid.innerHTML = data.results.map(movieCardHTML).join('');
    attachCardClicks(grid);
  }
  renderPagination();
}

function buildDiscoverParams() {
  const f = state.filters;
  const p = { sort_by: f.sort, page: f.page };
  if (f.genre) p.with_genres = f.genre;
  if (f.yearFrom) p['primary_release_date.gte'] = `${f.yearFrom}-01-01`;
  if (f.yearTo)   p['primary_release_date.lte'] = `${f.yearTo}-12-31`;
  if (Number(f.rating) > 0) p['vote_average.gte'] = f.rating;
  if (f.country) p.with_origin_country = f.country;
  return p;
}

function renderPagination() {
  const cont = $('#pagination');
  const total = state.discoverTotalPages;
  const cur = state.filters.page;
  if (total <= 1) { cont.innerHTML = ''; return; }

  const pages = new Set([1, total, cur, cur-1, cur+1, cur-2, cur+2]);
  const list = [...pages].filter(p => p >= 1 && p <= total).sort((a,b)=>a-b);

  let html = `<button data-page="${cur-1}" ${cur===1?'disabled':''}>←</button>`;
  let prev = 0;
  for (const p of list) {
    if (p - prev > 1) html += `<button disabled>…</button>`;
    html += `<button data-page="${p}" class="${p===cur?'is-active':''}">${p}</button>`;
    prev = p;
  }
  html += `<button data-page="${cur+1}" ${cur===total?'disabled':''}>→</button>`;
  cont.innerHTML = html;

  cont.querySelectorAll('button[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = Number(btn.dataset.page);
      if (!p || p < 1 || p > total) return;
      state.filters.page = p;
      renderDiscover();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

async function runSearch(q) {
  if (DEMO_MODE) {
    const lower = q.toLowerCase();
    const filtered = DEMO_MOVIES.filter(m =>
      m.title.toLowerCase().includes(lower) ||
      (m.original_title || '').toLowerCase().includes(lower)
    );
    showSearchResults(q, filtered, filtered.length);
    return;
  }
  try {
    const data = await tmdb('/search/movie', { query: q, page: 1 });
    showSearchResults(q, data.results || [], data.total_results || 0);
  } catch (e) {
    console.error('search', e);
  }
}

function showSearchResults(q, results, total) {
  state.discoverTotalPages = 1;
  $('#resultsCount').innerHTML =
    `Поиск «<b>${escapeHtml(q)}</b>»: <b>${total.toLocaleString('ru-RU')}</b> результатов`;
  const grid = $('#discoverGrid');
  if (!results.length) grid.innerHTML = '<div class="empty">Ничего не найдено</div>';
  else {
    grid.innerHTML = results.map(movieCardHTML).join('');
    attachCardClicks(grid);
  }
  $('#pagination').innerHTML = '';

  $$('.tab').forEach(x => x.classList.remove('is-active'));
  $$('.tab-panel').forEach(x => x.classList.remove('is-active'));
  document.querySelector('.tab[data-tab="discover"]').classList.add('is-active');
  $('#tab-discover').classList.add('is-active');
}

function renderFiltersStrip() {
  const f = state.filters;
  const items = [];
  if (f.genre) items.push(`Жанр: <b>${escapeHtml(genreName(Number(f.genre)))}</b>`);
  if (f.yearFrom) items.push(`С <b>${f.yearFrom}</b>`);
  if (f.yearTo)   items.push(`По <b>${f.yearTo}</b>`);
  if (Number(f.rating) > 0) items.push(`Рейтинг ≥ <b>${f.rating}</b>`);
  if (f.country) {
    const c = state.countries.find(x => x.code === f.country);
    items.push(`Страна: <b>${escapeHtml(c ? c.name : f.country)}</b>`);
  }
  $('#activeFilters').innerHTML = items.map(t => `<span class="badge">${t}</span>`).join('');
}

/* =========================================================
   ANALYTICS
   ========================================================= */
function drawDemoAnalytics() {
  const ratings = {};
  for (let i = 0; i <= 10; i += 0.5) ratings[i.toFixed(1)] = 0;
  DEMO_MOVIES.forEach(m => {
    const b = (Math.floor(m.vote_average * 2) / 2).toFixed(1);
    if (ratings[b] !== undefined) ratings[b]++;
  });
  drawBar('chartRatings', Object.keys(ratings), Object.values(ratings), 'Фильмов');

  const points = DEMO_MOVIES.map(m => ({ x: m.popularity, y: m.vote_average, label: m.title }));
  drawScatter('chartScatter', points);

  const topVotes = [...DEMO_MOVIES].sort((a,b) => b.vote_count - a.vote_count).slice(0,10);
  drawBar('chartVotes', topVotes.map(m => m.title.slice(0,24)), topVotes.map(m => m.vote_count), 'Голосов', true);
}

async function renderAnalytics() {
  if (DEMO_MODE) { drawDemoAnalytics(); return; }
  if (!API_KEY) return;
  try {
    const pages = [1,2,3,4,5];
    const results = await Promise.all(pages.map(p =>
      tmdb('/discover/movie', { ...buildDiscoverParams(), page: p })
        .then(r => r.results || []).catch(() => [])
    ));
    const flat = results.flat();
    if (!flat.length) return;

    const bins = {};
    for (let i = 0; i <= 10; i += 0.5) bins[i.toFixed(1)] = 0;
    flat.forEach(m => {
      const b = (Math.floor((m.vote_average||0)*2)/2).toFixed(1);
      if (bins[b] !== undefined) bins[b]++;
    });
    drawBar('chartRatings', Object.keys(bins), Object.values(bins), 'Фильмов');

    const points = flat.filter(m => m.vote_average && m.popularity != null)
      .map(m => ({ x: m.popularity, y: m.vote_average, label: m.title }));
    drawScatter('chartScatter', points);

    const topVotes = [...flat].sort((a,b) => (b.vote_count||0) - (a.vote_count||0)).slice(0,10);
    drawBar('chartVotes', topVotes.map(m => (m.title||'').slice(0,24)), topVotes.map(m => m.vote_count||0), 'Голосов', true);
  } catch (e) {
    console.error('analytics', e);
  }
}

/* =========================================================
   CHARTS
   ========================================================= */
function destroyChart(id) {
  if (state.charts[id]) { state.charts[id].destroy(); delete state.charts[id]; }
}

const CHART_FONT = { family: "'JetBrains Mono', monospace", size: 11 };

function drawBar(id, labels, data, label, horizontal = false) {
  const el = document.getElementById(id);
  if (!el || typeof Chart === 'undefined') return;
  destroyChart(id);
  state.charts[id] = new Chart(el, {
    type: 'bar',
    data: { labels, datasets: [{
      label, data,
      backgroundColor: '#e8ff47', borderColor: '#e8ff47', borderWidth: 0, borderRadius: 2
    }]},
    options: {
      indexAxis: horizontal ? 'y' : 'x',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#161616', borderColor: '#2a2a2a', borderWidth: 1,
          titleFont: CHART_FONT, bodyFont: CHART_FONT }
      },
      scales: {
        x: { ticks: { color: '#8a8a86', font: CHART_FONT }, grid: { color: '#1d1d1d' } },
        y: { ticks: { color: '#8a8a86', font: CHART_FONT }, grid: { color: '#1d1d1d' } }
      }
    }
  });
}

function drawDoughnut(id, labels, data) {
  const el = document.getElementById(id);
  if (!el || typeof Chart === 'undefined') return;
  destroyChart(id);
  const palette = ['#e8ff47','#ff4b2b','#4b8aff','#8affb2','#ff8aff','#ffb84b','#4bfff0','#b28aff','#ff4b6e','#a0a0a0'];
  state.charts[id] = new Chart(el, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: palette, borderColor: '#0e0e0e', borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { color: '#8a8a86', font: CHART_FONT, boxWidth: 10, padding: 8 } },
        tooltip: { backgroundColor: '#161616', borderColor: '#2a2a2a', borderWidth: 1,
          titleFont: CHART_FONT, bodyFont: CHART_FONT }
      }
    }
  });
}

function drawScatter(id, points) {
  const el = document.getElementById(id);
  if (!el || typeof Chart === 'undefined') return;
  destroyChart(id);
  state.charts[id] = new Chart(el, {
    type: 'scatter',
    data: { datasets: [{
      label: 'Фильмы', data: points,
      backgroundColor: '#e8ff47', pointRadius: 4, pointHoverRadius: 6
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#161616', borderColor: '#2a2a2a', borderWidth: 1,
          titleFont: CHART_FONT, bodyFont: CHART_FONT,
          callbacks: {
            label: (ctx) => {
              const p = ctx.raw;
              return `${p.label}: рейтинг ${p.y.toFixed(1)}, популярность ${p.x.toFixed(0)}`;
            }
          }
        }
      },
      scales: {
        x: { title: { display: true, text: 'Популярность', color: '#8a8a86', font: CHART_FONT },
             ticks: { color: '#8a8a86', font: CHART_FONT }, grid: { color: '#1d1d1d' } },
        y: { title: { display: true, text: 'Рейтинг', color: '#8a8a86', font: CHART_FONT },
             ticks: { color: '#8a8a86', font: CHART_FONT }, grid: { color: '#1d1d1d' },
             min: 0, max: 10 }
      }
    }
  });
}

/* =========================================================
   MODAL
   ========================================================= */
async function openMovie(id) {
  const modal = $('#modal');
  const content = $('#modalContent');
  content.innerHTML = '<div class="loading" style="padding:60px;">Загрузка…</div>';
  modal.hidden = false;
  document.body.style.overflow = 'hidden';

  if (DEMO_MODE) {
    const m = DEMO_MOVIES.find(x => x.id === id);
    if (m) content.innerHTML = renderDemoModal(m);
    content.querySelector('.modal-close')?.addEventListener('click', closeModal);
    return;
  }

  try {
    const data = await tmdb(`/movie/${id}`, { append_to_response: 'credits' });
    content.innerHTML = renderModalHTML(data);
    content.querySelector('.modal-close')?.addEventListener('click', closeModal);
  } catch (e) {
    console.error(e);
    content.innerHTML = '<div class="empty">Не удалось загрузить фильм</div>';
  }
}

function closeModal() {
  $('#modal').hidden = true;
  document.body.style.overflow = '';
}

function renderDemoModal(m) {
  const year = (m.release_date || '').slice(0,4);
  const genres = m.genre_ids.map(id => `<span class="genre-tag">${escapeHtml(genreName(id))}</span>`).join('');
  return `
    <button class="modal-close" aria-label="Закрыть">×</button>
    <div class="modal-head">
      <div><div class="no-poster" style="aspect-ratio:2/3;">${escapeHtml(m.title)}</div></div>
      <div>
        <div class="modal-title">${escapeHtml(m.title)}</div>
        <div class="modal-original">${escapeHtml(m.original_title || '')}</div>
        <div class="modal-facts">
          <span><b>${year}</b></span>
          <span>Рейтинг: <b>${m.vote_average.toFixed(1)}</b></span>
          <span>Голосов: <b>${m.vote_count.toLocaleString('ru-RU')}</b></span>
        </div>
        <div class="movie-genres" style="margin-bottom:14px;">${genres}</div>
        <div class="modal-overview">${escapeHtml(m.overview)}</div>
      </div>
    </div>
    <div class="modal-body">
      <div class="empty">Демо-режим: актёры доступны только с API key</div>
    </div>`;
}

function renderModalHTML(d) {
  const poster = posterUrl(d.poster_path, 'w500');
  const year = (d.release_date || '').slice(0,4) || '—';
  const runtime = d.runtime ? `${d.runtime} мин` : '—';
  const countries = (d.production_countries || []).map(c => c.name).join(', ') || '—';
  const genres = (d.genres || []).map(g => `<span class="genre-tag">${escapeHtml(g.name)}</span>`).join('');
  const director = (d.credits?.crew || []).find(c => c.job === 'Director');
  const cast = (d.credits?.cast || []).slice(0, 12);

  return `
    <button class="modal-close" aria-label="Закрыть">×</button>
    <div class="modal-head">
      <div>
        ${poster ? `<img src="${poster}" alt="${escapeHtml(d.title)}">`
                 : `<div class="no-poster" style="aspect-ratio:2/3;">NO POSTER</div>`}
      </div>
      <div>
        <div class="modal-title">${escapeHtml(d.title)}</div>
        ${d.original_title && d.original_title !== d.title
          ? `<div class="modal-original">${escapeHtml(d.original_title)}</div>` : ''}
        <div class="modal-facts">
          <span><b>${year}</b></span>
          <span>Рейтинг: <b>${Number(d.vote_average||0).toFixed(1)}</b></span>
          <span>Голосов: <b>${(d.vote_count||0).toLocaleString('ru-RU')}</b></span>
          <span>Длительность: <b>${runtime}</b></span>
        </div>
        <div class="movie-genres" style="margin-bottom:14px;">${genres}</div>
        <div class="modal-facts">
          <span>Страны: <b>${escapeHtml(countries)}</b></span>
          ${director ? `<span>Режиссёр: <b>${escapeHtml(director.name)}</b></span>` : ''}
        </div>
        ${d.overview ? `<div class="modal-overview">${escapeHtml(d.overview)}</div>` : ''}
      </div>
    </div>
    ${cast.length ? `
      <div class="modal-body">
        <div class="modal-section">
          <h4>Актёры</h4>
          <div class="cast-list">
            ${cast.map(c => `
              <div class="cast-item">
                <div class="cast-name">${escapeHtml(c.name)}</div>
                <div class="cast-role">${escapeHtml(c.character || '—')}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>` : ''}`;
}
</script>
</body>
</html>
